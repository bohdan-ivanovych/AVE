app:
  name: "Autonomous Video Engine - AVE"
  version: "2.0.0"

paths:
  # Override with CHROME_BASE_PATH env var or edit directly.
  # Windows default: C:\Users\<YourUser>\AppData\Local\Google\Chrome\User Data
  chrome_base: "${CHROME_BASE_PATH:C:\\Users\\User\\AppData\\Local\\Google\\Chrome\\User Data}"
  edge_base: "${EDGE_BASE_PATH:}"
  assets_dir: "assets"
  subjects_dir: "assets/subjects"
  references_dir: "assets/references"
  outputs_dir: "outputs"
  outpaint_dir: "outputs/outpaint"
  qwen_dir: "outputs/qwen"
  profiles_dir: "profiles"
  logs_dir: "logs"

sora:
  url: "https://sora.chatgpt.com/library"
  # Profiles are auto-discovered from chrome_base at startup.
  # You can override the list explicitly here if needed.
  default_profiles: ["Default", "Profile 1", "Profile 2", "Profile 3", "Profile 4", "Profile 5"]
  timeout_seconds: 240
  navigation_retries: 3
  button_wait_seconds: 60
  notification_timeout_seconds: 240
  notification_check_interval: 1
  browser_timeout: 60000
  navigation_timeout: 45000
  scroll_delay: 200
  upload_delay: 800
  upload_delay_last: 400
  create_click_delay: 1500
  download_timeout: 30000

batch:
  max_concurrent_tasks: 12
  max_variants_per_task: 2
  semaphore_limit: 12
  max_parallel_browsers: 6

images:
  supported_formats: [".jpg", ".jpeg", ".png", ".webp"]
  max_size_mb: 50
  max_images_per_task: 4

notifications:
  enabled: true
  on_task_complete: true
  on_batch_complete: true
  on_error: true

logging:
  level: "INFO"
  file_logging: true
  max_log_files: 10
  log_file_size_mb: 10

browser:
  channel: "chrome"
  enable_stealth: true
  user_agent: ""
  executable_path: ""
  extra_args: []
  qwen_extra_args: []
  max_contexts_per_profile: 1
  profile_lock_timeout_seconds: 45
